[build]
  # Directory to change to before starting a build.
  # This is where we will install dependencies and build the production version of your front end
  base = "."
  
  # Directory (relative to root of your repo) that contains the deploy-ready HTML files and
  # assets generated by the build. If a base directory has been specified, same as 
  # the publish path would be relative to your base directory  
  publish = "dist/"
  
  # Default build command.
  command = "npm run build"

# Production environment variables
[build.environment]
  NODE_VERSION = "18"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form submissions (if you plan to add contact forms later)
[forms]
  forms = { }